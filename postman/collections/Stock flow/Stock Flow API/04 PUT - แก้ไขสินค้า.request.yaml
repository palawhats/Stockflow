  type: json
  content: |-
    {
      "sku": "SKU-{{timestamp}}",
      "name": "สินค้าแก้ไขแล้ว",
      "description": "อัปเดตข้อมูลจาก Postman",
      "category": "ทั่วไป",
      "price": 299,
      "stock": 20,
      "unit": "ชิ้น",
      "isActive": true
    }
settings: {}
order: 4000
